org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=true
# Do not set org.gradle.java.home here — it is machine-specific.
# Gradle will use JAVA_HOME or Android Studio's bundled JDK.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Keep false so plugins (e.g. Sumsub) can still apply kotlin-android.
android.builtInKotlin=false
